name: 'Axiom Scan'
description: 'Scan MCP servers for security vulnerabilities. Detects tool poisoning, prompt injection, credential theft, and supply chain attacks. Aligned with OWASP Agentic AI Top 10.'
author: 'Axiom'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'MCP server to scan — GitHub URL, npm package, or PyPI package name'
    required: false
    default: ''
  scan-local:
    description: 'Scan local MCP config files in the repo (.mcp.json, .cursor/mcp.json, etc.)'
    required: false
    default: 'true'
  config-path:
    description: 'Path to specific MCP config file to scan'
    required: false
    default: ''
  fail-on:
    description: 'Minimum severity to fail the check: critical, high, medium, low, or none'
    required: false
    default: 'high'
  output-format:
    description: 'Output format: table, json, or sarif'
    required: false
    default: 'table'
  anthropic-api-key:
    description: 'Anthropic API key for AI-powered analysis (optional, enables claimed-vs-actual)'
    required: false
    default: ''
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  risk-score:
    description: 'Overall risk score (0-100)'
    value: ${{ steps.scan.outputs.risk-score }}
  risk-level:
    description: 'Risk level: safe, low, medium, high, critical'
    value: ${{ steps.scan.outputs.risk-level }}
  findings-count:
    description: 'Total number of security findings'
    value: ${{ steps.scan.outputs.findings-count }}
  sarif-file:
    description: 'Path to SARIF output file (if output-format is sarif)'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Axiom
      shell: bash
      run: |
        # Install the source bundled with this action, so the pinned ref is what runs.
        # the action must run the exact ref the workflow pinned, not a PyPI release.
        pip install "${{ github.action_path }}"

    - name: Run Axiom Scan
      id: scan
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AXIOM_CI: 'true'
      run: |
        set +e
        EXIT_CODE=0
        RISK_SCORE=0
        RISK_LEVEL="safe"
        FINDINGS=0

        # Scan specific target if provided
        if [ -n "${{ inputs.target }}" ]; then
          echo "::group::Scanning ${{ inputs.target }}"
          OUTPUT=$(axiom scan "${{ inputs.target }}" --output json ${{ inputs.anthropic-api-key && '--no-ai' || '' }} 2>&1)
          SCAN_EXIT=$?

          if [ $SCAN_EXIT -gt $EXIT_CODE ]; then
            EXIT_CODE=$SCAN_EXIT
          fi

          RISK_SCORE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('risk_score',0))" 2>/dev/null || echo "0")
          RISK_LEVEL=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('risk_level','safe'))" 2>/dev/null || echo "safe")
          FINDINGS=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('findings_count',0))" 2>/dev/null || echo "0")

          echo "$OUTPUT" | python3 -c "
        import sys, json
        try:
            d = json.load(sys.stdin)
            print(f\"Risk: {d.get('risk_score',0)}/100 ({d.get('risk_level','safe')})\")
            print(f\"Findings: {d.get('findings_count',0)}\")
            for f in d.get('findings', [])[:20]:
                asi = ','.join(f.get('owasp_asi') or []) or '-'
                print(f\"  [{f['severity'].upper()}] [{asi}] {f['title']}\")
        except: pass
        " 2>/dev/null
          echo "::endgroup::"
        fi

        # Scan local configs if enabled
        if [ "${{ inputs.scan-local }}" = "true" ]; then
          echo "::group::Scanning local MCP configs"

          CONFIG_PATH="${{ inputs.config-path }}"
          if [ -n "$CONFIG_PATH" ]; then
            LOCAL_OUTPUT=$(axiom local --path "$CONFIG_PATH" --output json 2>&1)
          else
            LOCAL_OUTPUT=$(axiom local --output json 2>&1)
          fi

          LOCAL_FINDINGS=$(echo "$LOCAL_OUTPUT" | python3 -c "
        import sys, json
        try:
            d = json.load(sys.stdin)
            findings = d.get('findings', [])
            print(len(findings))
            for f in findings[:20]:
                print(f\"  [{f['severity'].upper()}] {f['title']}\")
        except: print('0')
        " 2>/dev/null)

          echo "Local config findings: $LOCAL_FINDINGS"
          echo "::endgroup::"
        fi

        # Set outputs
        echo "risk-score=$RISK_SCORE" >> $GITHUB_OUTPUT
        echo "risk-level=$RISK_LEVEL" >> $GITHUB_OUTPUT
        echo "findings-count=$FINDINGS" >> $GITHUB_OUTPUT

        # Determine exit code based on fail-on threshold
        FAIL_ON="${{ inputs.fail-on }}"
        case "$FAIL_ON" in
          none)     FINAL_EXIT=0 ;;
          low)      FINAL_EXIT=$EXIT_CODE ;;
          medium)   [ $EXIT_CODE -ge 1 ] && FINAL_EXIT=1 || FINAL_EXIT=0 ;;
          high)     [ $EXIT_CODE -ge 2 ] && FINAL_EXIT=1 || FINAL_EXIT=0 ;;
          critical) [ "$RISK_LEVEL" = "critical" ] && FINAL_EXIT=1 || FINAL_EXIT=0 ;;
          *)        FINAL_EXIT=$EXIT_CODE ;;
        esac

        exit $FINAL_EXIT
