[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-scan"
version = "0.6.0"
description = "Axiom by Helion Works: a security scanner for AI agent tooling. Scans MCP (Model Context Protocol) servers and agent tooling for tool poisoning, prompt injection, credential theft and supply-chain attacks - and never calls a tool."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Helion Works", email = "contact@helionworks.com"},
]
keywords = ["mcp", "security", "scanner", "model-context-protocol", "ai-security", "tool-poisoning", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.15.1,<1.0",
    "click>=8.1,<8.2",
    "rich~=13.9.0",
    "httpx~=0.27.0",
    "python-dotenv~=1.0.1",
    "pydantic>=2.9,<3",
    # TypeScript/JavaScript parsing for the Agent Surface Map
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.26",
]

[project.optional-dependencies]
api = [
    "fastapi~=0.115.0",
    "jinja2~=3.1",
    "uvicorn[standard]~=0.30.0",
    "slowapi~=0.1.9",
]
ai = [
    "anthropic~=0.39.0",
]
a2a = [
    "PyJWT[crypto]~=2.9",
    "jsonschema>=4.18",
]
all = [
    "fastapi~=0.115.0",
    "jinja2~=3.1",
    "uvicorn[standard]~=0.30.0",
    "slowapi~=0.1.9",
    "anthropic~=0.39.0",
    "PyJWT[crypto]~=2.9",
    "jsonschema>=4.18",
]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/helion-works/axiom"
Repository = "https://github.com/helion-works/axiom"
Documentation = "https://github.com/helion-works/axiom"
Issues = "https://github.com/helion-works/axiom/issues"

[project.scripts]
axiom = "cli.axiom_cli:app"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["app*", "cli*", "data*"]

[tool.setuptools.package-data]
data = ["*.py", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
